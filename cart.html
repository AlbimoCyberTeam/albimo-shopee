<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang Belanja</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<header>
<div class="logo">🛒KERANJANG</div>
<nav>
<a href="user-dashboard.html">Kembali</a>
</nav>
</header>

<div id="cartContainer" class="products-grid"></div>

<div class="card">
<h2>Total Belanja</h2>
<p id="totalPrice">Rp 0</p>

<input type="text" id="customerName" placeholder="Nama Lengkap">
<input type="text" id="customerPhone" placeholder="Nomor HP Aktif">
<textarea id="customerAddress" placeholder="Alamat Lengkap"></textarea>

<button onclick="checkout()">Checkout Sekarang</button>

</div>

<div class="card" id="paymentBox" style="display:none">
<h2>Pembayaran Transfer</h2>
<p><b>Bank BCA</b></p>
<p>No Rekening: 1234567890</p>
<p>Atas Nama: ALBIMO STORE</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=ALBIMO-STORE-PAYMENT" style="max-width:250px;width:100%">
<input type="file" id="transferProof" accept="image/*">
<p>Silakan upload bukti transfer lalu kirim ke admin.</p>
</div>

<script src="firebase.js"></script>
<script src="auth.js"></script>
<script>
checkRole('user', 'login.html');

const cart = JSON.parse(localStorage.getItem('cart') || '[]');
const container = document.getElementById('cartContainer');
let total = 0;

function renderCart(){
container.innerHTML = '';
total = 0;

if(cart.length === 0){
container.innerHTML = '<div class="card"><h3>Keranjang masih kosong</h3></div>';
}
cart.forEach((item,index)=>{

total += Number(item.price || 0);

container.innerHTML += `
<div class="product-card">

<img
src="${item.image || 'assets/AlbimoLogo.png'}"
class="product-image"
onerror="this.src='assets/AlbimoLogo.png'">

<div class="product-content">

<h3>${item.name || 'Produk'}</h3>

<p>
${new Intl.NumberFormat('id-ID',{
style:'currency',
currency:'IDR',
minimumFractionDigits:0
}).format(Number(item.price || 0))}
</p>

<button onclick="removeItem(${index})">
Hapus
</button>

</div>
</div>
`;
});

document.getElementById('totalPrice').innerText =
new Intl.NumberFormat('id-ID',{
    style:'currency',
    currency:'IDR',
    minimumFractionDigits:0
}).format(total);

} // <-- tutup renderCart() di sini

function removeItem(index){

function checkout(){
if(cart.length === 0){
alert('Keranjang kosong');
return;
}

const user = auth.currentUser;

if(!user){
alert('Silakan login terlebih dahulu');
window.location.href = 'login.html';
return;
}

const customerName = document.getElementById('customerName').value.trim();
const customerPhone = document.getElementById('customerPhone').value.trim();
const customerAddress = document.getElementById('customerAddress').value.trim();

if(!customerName || !customerPhone || !customerAddress){
alert('Nama, nomor HP dan alamat wajib diisi');
return;
}

const orderData = {
userId: user.uid,
userEmail: user.email,
customerName,
customerPhone,
customerAddress,
items: cart,
total: total,
status: 'Menunggu Konfirmasi',
checkoutAt: Date.now()
};

const orderId = db.ref('orders').push().key;

db.ref('orders/' + orderId).set(orderData)
.then(()=>{
document.getElementById('paymentBox').style.display='block';
alert('Pesanan dibuat. Silakan transfer dan upload bukti pembayaran.');
localStorage.removeItem('cart');
window.location.reload();
})
.catch((error)=>{
alert('Checkout gagal: ' + error.message);
});
}
console.log(cart);
renderCart();
</script>
</body>
</html>
