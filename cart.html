<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang Belanja</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">KERANJANG</div>
<nav>
<a href="user-dashboard.html">Kembali</a>
</nav>
</header>

<div id="cartContainer" class="products-grid"></div>

<div class="card">
<h2>Total</h2>
<p id="totalPrice">Rp 0</p>
<button onclick="checkout()">Checkout Sekarang</button>
</div>

<script>
const cart = JSON.parse(localStorage.getItem('cart') || '[]');
const container = document.getElementById('cartContainer');

let total = 0;

cart.forEach((item,index)=>{
total += Number(item.price);

container.innerHTML += `
<div class="product-card">
<img src="${item.image}">
<div class="product-content">
<h3>${item.name}</h3>
<p>Rp ${item.price}</p>
<button onclick="removeItem(${index})">Hapus</button>
</div>
</div>
`;
});

document.getElementById('totalPrice').innerText = 'Rp ' + total;

function removeItem(index){
cart.splice(index,1);
localStorage.setItem('cart', JSON.stringify(cart));
location.reload();
}

function checkout(){
if(cart.length === 0){
alert('Keranjang kosong');
return;
}

alert('Checkout berhasil');
localStorage.removeItem('cart');
location.reload();
}
</script>

</body>
</html>
