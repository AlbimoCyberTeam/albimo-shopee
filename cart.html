<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang Belanja</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<header>
<div class="logo">🛒KERANJANG</div>
<nav>
<a href="user-dashboard.html">Kembali</a>
</nav>
</header>

<div id="cartContainer" class="products-grid"></div>

<div class="card">
<h2>Total Belanja</h2>
<p id="totalPrice">Rp 0</p>

<input type="text" id="customerName" placeholder="Nama Lengkap">
<input type="text" id="customerPhone" placeholder="Nomor HP Aktif">
<textarea id="customerAddress" placeholder="Alamat Lengkap"></textarea>

<button onclick="checkout()">Checkout Sekarang</button>

</div>

<div class="payment-box">
<h2>Pembayaran</h2>
<p><strong>Transfer Bank:</strong></p>
<ul>
<li>Bank BNI : 2038992622</li>
<li>Bank BRI : 497301014325530</li>
<li>DANA : 082199326022</li>
</ul>

<div class="qr-box">
<h3>QRIS Pembayaran</h3>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=ALBIMO-STORE" style="max-width:220px;border-radius:12px;">
<input type="file" id="transferProof" accept="image/*">
<p>Silakan upload bukti transfer lalu kirim ke admin.</p>
</div>
</body>
</html>

<script src="firebase.js"></script>
<script src="auth.js"></script>
<script>
checkRole('user', 'login.html');

const cart = JSON.parse(localStorage.getItem('cart') || '[]');
const container = document.getElementById('cartContainer');
let total = 0;

function renderCart(){
container.innerHTML = '';
total = 0;

if(cart.length === 0){
container.innerHTML = '<div class="card"><h3>Keranjang masih kosong</h3></div>';
}

cart.forEach((item,index)=>{
total += Number(item.price);

container.innerHTML += `
<div class="product-card">
<img src="${item.image}">
<div class="product-content">
<h3>${item.name}</h3>
<p>
${new Intl.NumberFormat('id-ID',{
    style:'currency',
    currency:'IDR',
    minimumFractionDigits:0
}).format(Number(item.price))}
</p>
<button onclick="removeItem(${index})">Hapus</button>
</div>
</div>
`;
});

document.getElementById('totalPrice').innerText =
new Intl.NumberFormat('id-ID',{
    style:'currency',
    currency:'IDR',
    minimumFractionDigits:0
}).format(total);

function removeItem(index){
cart.splice(index,1);
localStorage.setItem('cart', JSON.stringify(cart));
renderCart();
}

function checkout(){
if(cart.length === 0){
alert('Keranjang kosong');
return;
}

const user = auth.currentUser;

if(!user){
alert('Silakan login terlebih dahulu');
window.location.href = 'login.html';
return;
}

const customerName = document.getElementById('customerName').value.trim();
const customerPhone = document.getElementById('customerPhone').value.trim();
const customerAddress = document.getElementById('customerAddress').value.trim();

if(!customerName || !customerPhone || !customerAddress){
alert('Nama, nomor HP dan alamat wajib diisi');
return;
}

const orderData = {
userId: user.uid,
userEmail: user.email,
customerName,
customerPhone,
customerAddress,
items: cart,
total: total,
status: 'Menunggu Konfirmasi',
checkoutAt: Date.now()
};

const orderId = db.ref('orders').push().key;

db.ref('orders/' + orderId).set(orderData)
.then(()=>{
document.getElementById('paymentBox').style.display='block';
alert('Pesanan dibuat. Silakan transfer dan upload bukti pembayaran.');
localStorage.removeItem('cart');
window.location.reload();
})
.catch((error)=>{
alert('Checkout gagal: ' + error.message);
});
}

renderCart();
</script>
</body>
</html>
