<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<link rel="stylesheet" href="assets/premium-style.css"></head>
<body>

<center>
<img src="https://h.top4top.io/p_3801qj5bz0.png" width="150">
</center>
  
<div class="auth-box">
<h2>Register</h2>
<input type="email" id="email" placeholder="Masukkan email">
<input type="password" id="password" placeholder="Masukkan password">
<button type="button" id="registerBtn" onclick="registerUser()">Register</button>
<p id="msg"></p>
</div>
<script src="firebase.js"></script>
<script>
function registerUser(){
const email=document.getElementById('email').value;
const password=document.getElementById('password').value;

if(!email || !password){
alert('Email dan password wajib diisi');
return;
}

auth.createUserWithEmailAndPassword(email,password)
.then((userCredential)=>{
const user=userCredential.user;

return db.ref('users/' + user.uid).set({
email: email,
role: 'user',
createdAt: Date.now(),
cart: []
});
})
.then(()=>{
alert('Register berhasil');
window.location.href='login.html';
})
.catch((error)=>{
console.log(error); document.getElementById('msg').innerText=error.message;
});
}
</script>

<div class="payment-box">
<h2>Pembayaran</h2>
<p><strong>Transfer Bank:</strong></p>
<ul>
<li>Bank BCA : 1234567890</li>
<li>Bank BRI : 9876543210</li>
<li>DANA : 08123456789</li>
</ul>

<div class="qr-box">
<h3>QRIS Pembayaran</h3>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=ALBIMO-STORE" style="max-width:220px;border-radius:12px;">
</div>
</div>
</body>
</html>
