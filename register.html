<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header>
<div class="logo"><img src="https://h.top4top.io/p_3801qj5bz0.png" width="70">
</div>
  
<div class="auth-box">
<h2>Register</h2>
<input type="email" id="email" placeholder="Masukkan email">
<input type="password" id="password" placeholder="Masukkan password">
<button type="button" id="registerBtn" onclick="registerUser()">Register</button>
<p id="msg"></p>
</div>
<script src="firebase.js"></script>
<script>
function registerUser(){
const email=document.getElementById('email').value;
const password=document.getElementById('password').value;

if(!email || !password){
alert('Email dan password wajib diisi');
return;
}

auth.createUserWithEmailAndPassword(email,password)
.then((userCredential)=>{
const user=userCredential.user;

return db.ref('users/' + user.uid).set({
email: email,
role: 'user',
createdAt: Date.now(),
cart: []
});
})
.then(()=>{
alert('Register berhasil');
window.location.href='login.html';
})
.catch((error)=>{
console.log(error); document.getElementById('msg').innerText=error.message;
});
}
</script>
</body>
</html>
