<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<link rel="stylesheet" href="assets/premium-style.css"></head>
<body>

<div class="auth-box">

<h2>Reset Password</h2>

<input type="email" id="email" placeholder="Masukkan email">

<button onclick="resetPassword()">Kirim Link Reset</button>

<p id="msg"></p>

</div>

<script src="firebase.js"></script>

<script>

function resetPassword(){

const email = document.getElementById('email').value;

if(!email){
alert('Masukkan email');
return;
}

auth.sendPasswordResetEmail(email)
.then(()=>{
alert('Link reset password berhasil dikirim');
})
.catch((error)=>{
document.getElementById('msg').innerHTML = error.message;
});

}

</script>


<div class="payment-box">
<h2>Pembayaran</h2>
<p><strong>Transfer Bank:</strong></p>
<ul>
<li>Bank BCA : 1234567890</li>
<li>Bank BRI : 9876543210</li>
<li>DANA : 08123456789</li>
</ul>

<div class="qr-box">
<h3>QRIS Pembayaran</h3>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=ALBIMO-STORE" style="max-width:220px;border-radius:12px;">
</div>
</div>
</body>
</html>
