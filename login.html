<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Sistem</title>
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
.role-box{
display:flex;
gap:10px;
margin-bottom:15px;
}
.role-btn{
flex:1;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#e5e7eb;
font-weight:bold;
}
.role-btn.active{
background:#111827;
color:white;
}
</style>
</head>
<body>

<div class="auth-box">
<h2>Login User & Admin</h2>

<div class="role-box">
<button class="role-btn active" id="userBtn" onclick="setRole('user')">User</button>
<button class="role-btn" id="adminBtn" onclick="setRole('admin')">Admin</button>
</div>

<input type="email" id="email" placeholder="Masukkan email">
<input type="password" id="password" placeholder="Masukkan password">

<button type="button" onclick="loginAccount()">
Masuk Sekarang
</button>

<br><br>

<a href="reset-password.html">Lupa Password?</a>

<p id="msg"></p>

</div>

<script src="firebase.js"></script>

<script>
let selectedRole = 'user';

function setRole(role){
selectedRole = role;

document.getElementById('userBtn').classList.remove('active');
document.getElementById('adminBtn').classList.remove('active');

if(role === 'user'){
  document.getElementById('userBtn').classList.add('active');
}else{
  document.getElementById('adminBtn').classList.add('active');
}
}

function loginAccount() {

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if(!email || !password){
alert('Email dan password wajib diisi');
return;
}

auth.signInWithEmailAndPassword(email, password)
.then((userCredential) => {

const user = userCredential.user;

 db.ref('users/' + user.uid).once('value')
 .then((snapshot)=>{

 if(snapshot.exists()){

 const data = snapshot.val();

 if(data.role === selectedRole){

   if(selectedRole === 'admin'){
      alert('Login admin berhasil');
      window.location.href = 'admin-dashboard.html';
   }else{
      alert('Login user berhasil');
      window.location.href = 'user-dashboard.html';
   }

 }else{
   alert('Role akun tidak sesuai');
   auth.signOut();
 }

 }else{
 alert('Data akun tidak ditemukan');
 auth.signOut();
 }

 });

})
.catch((error) => {

if (error.code === "auth/user-not-found") {
alert("User tidak ditemukan");

} else if (error.code === "auth/wrong-password") {
alert("Password salah");

} else {
alert(error.message);
}

});
}
</script>

</body>
</html>
