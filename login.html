<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">⁸
<title>Login Sistem</title>
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link rel="stylesheet" href="assets/premium-style.css"></head>
<body>
  
<center>
<img src="https://h.top4top.io/p_3801qj5bz0.png" width="150">
</center>
  
<div class="auth-box">
<h2>Login Albimo Store</h2>

<p style="text-align:center;margin-bottom:15px;">
Silakan login menggunakan akun Anda
</p>

<input type="email" id="email" placeholder="Masukkan email">
<input type="password" id="password" placeholder="Masukkan password">

<button type="button" onclick="loginAccount()">
Masuk Sekarang
</button>

<br><br>

<a href="reset-password.html">Lupa Password?</a>

<p id="msg"></p>

</div>

<script src="firebase.js"></script>

<script>
function loginAccount() {

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if(!email || !password){
alert('Email dan password wajib diisi');
return;
}

auth.signInWithEmailAndPassword(email, password)
.then((userCredential) => {

const user = userCredential.user;

db.ref('users/' + user.uid).once('value')
.then((snapshot)=>{

if(snapshot.exists()){

const data = snapshot.val();

if(data.role === 'admin'){

alert('Login admin berhasil');
window.location.href = 'admin-dashboard.html';

}else{

alert('Login user berhasil');
window.location.href = 'user-dashboard.html';

}

}else{

alert('Data akun tidak ditemukan');
auth.signOut();

}

});

})
.catch((error) => {

if (error.code === "auth/user-not-found") {
alert("User tidak ditemukan");

} else if (error.code === "auth/wrong-password") {
alert("Password salah");

} else {
alert(error.message);
}

});
}
</script>

</div>
</div>
</body>
