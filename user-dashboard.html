<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Marketplace</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header>
<div class="logo">ALBIMO SHOPEE</div>
<nav>
<a href="cart.html">Keranjang</a>
<a href="#" onclick="logoutUser('login.html')">Logout</a>
</nav>
</header>

<section class="hero">
<h1>Marketplace Premium</h1>
<p>Belanja mudah dan cepat</p>
</section>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Cari produk..." onkeyup="searchProducts()">
</div>

<div class="products-grid" id="productList"></div>

<script src="firebase.js"></script>
<script src="auth.js"></script>

<script>
checkRole('user', 'login.html');

function loadProducts(){
const list = document.getElementById('productList');

db.ref('products').on('value',(snapshot)=>{
list.innerHTML='';

snapshot.forEach((child)=>{
const product = child.val();

list.innerHTML += `
<div class="product-card">
<img src="${product.image}">
<div class="product-content">
<h3>${product.name}</h3>
<p class="price">Rp ${product.price}</p>
<p>${product.description || ''}</p>

<button onclick="addCart('${product.name}','${product.price}','${product.image}')">
Tambah Keranjang
</button>

</div>
</div>
`;
});
});
}

function addCart(name,price,image){
const cart = JSON.parse(localStorage.getItem('cart') || '[]');
cart.push({name,price,image});
localStorage.setItem('cart', JSON.stringify(cart));
alert('Produk berhasil ditambahkan ke keranjang');
}

function searchProducts(){
const input = document.getElementById('searchInput').value.toLowerCase();
const cards = document.querySelectorAll('.product-card');

cards.forEach(card=>{
card.style.display = card.innerText.toLowerCase().includes(input)
? 'block' : 'none';
});
}

loadProducts();
</script>

</body>
</html>
