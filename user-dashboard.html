<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Marketplace</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header>
<div class="logo">ALBIMO STORE</div>
<nav>
<a href="cart.html">Keranjang</a>
<a href="#" onclick="logoutUser('login.html')">Logout</a>
</nav>
</header>

<div id="userInfo" style="padding:10px 20px;background:#f5f5f5;font-weight:bold"></div>
<section class="hero">
<center>
  <img src="https://b.top4top.io/p_3808aw9wu0.png" width="450">
</center>
<p>Wellcome To Albimo Store</p>
</section>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Cari produk..." onkeyup="searchProducts()">
</div>

<div class="products-grid" id="productList"></div>
<h2 style="padding:20px;">Riwayat Pesanan Saya</h2>
<div id="myOrders" style="padding:20px"></div>


<script src="firebase.js"></script>
<script src="auth.js"></script>

<script>
checkRole('user', 'login.html');
auth.onAuthStateChanged(function(user){if(user){document.getElementById('userInfo').innerHTML='UID: '+user.uid+' | Email: '+(user.email||'');}});

function loadProducts(){
const list = document.getElementById('productList');

db.ref('products').on('value',(snapshot)=>{
list.innerHTML='';

snapshot.forEach((child)=>{
const product = child.val();

list.innerHTML += `
<div class="product-card">
<img src="${product.image}">
<div class="product-content">
<h3>${product.name}</h3>
<p class="price">Rp ${product.price}</p>
<p>${product.description || ''}</p>

<button onclick="addCart('${product.name}','${product.price}','${product.image}')">
Tambah Keranjang
</button>

</div>
</div>
`;
});
});
}

function addCart(name,price,image){
const cart = JSON.parse(localStorage.getItem('cart') || '[]');
cart.push({name,price,image});
localStorage.setItem('cart', JSON.stringify(cart));
alert('Produk berhasil ditambahkan ke keranjang');
}

function searchProducts(){
const input = document.getElementById('searchInput').value.toLowerCase();
const cards = document.querySelectorAll('.product-card');

cards.forEach(card=>{
card.style.display = card.innerText.toLowerCase().includes(input)
? 'block' : 'none';
});
}


function loadMyOrders(){
auth.onAuthStateChanged(function(user){
 if(!user) return;
 db.ref('orders').on('value',function(s){
   let html='';
   s.forEach(function(ch){
     const o=ch.val()||{};
     if(o.userId===user.uid){
       html += `<div class="product-card"><div class="product-content"><h3>Order #${ch.key}</h3><p>Status: ${o.status||'-'}</p><p>Total: Rp ${Number(o.total||0).toLocaleString('id-ID')}</p></div></div>`;
     }
   });
   document.getElementById('myOrders').innerHTML=html||'Belum ada pesanan';
 });
});
}
loadProducts();
loadMyOrders();

</script>

</body>
</html>
